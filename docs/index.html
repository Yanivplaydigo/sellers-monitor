<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sellers.json Monitor</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--text:#14161a;--muted:#646b76;--line:#e3e6eb;
  --accent:#3b5bdb;--add:#2b8a3e;--add-bg:#e6f4ea;--rem:#c92a2a;--rem-bg:#fdecec;
  --chg:#b35c00;--chg-bg:#fff2e0;--warn:#b35c00;--warn-bg:#fff6e6;--alert:#c92a2a;--alert-bg:#fff0f0;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1114;--card:#171a1f;--text:#e8eaed;--muted:#9aa1ab;--line:#2a2f37;
  --accent:#7c9cff;--add:#69db7c;--add-bg:#15301d;--rem:#ff8787;--rem-bg:#3a1a1a;
  --chg:#ffb35c;--chg-bg:#3a2a12;--warn:#ffb35c;--warn-bg:#2e2412;--alert:#ff8787;--alert-bg:#331a1a;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:22px;margin:0}
h2{font-size:15px;margin:0 0 12px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .v{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.alert{background:var(--alert-bg);border:1px solid var(--alert);border-radius:10px;padding:12px 16px;margin-bottom:16px}
.alert b{color:var(--alert)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--card)}
td.wrapcell{white-space:normal;min-width:220px}
.num{text-align:right}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.added{color:var(--add);background:var(--add-bg)}
.removed{color:var(--rem);background:var(--rem-bg)}
.changed{color:var(--chg);background:var(--chg-bg)}
.st-ok{color:var(--add)}.st-error,.st-anomaly{color:var(--warn)}.st-baseline{color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
input,select,button{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=search]{flex:1;min-width:200px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.star{color:var(--alert);font-weight:700}
.empty{padding:24px;text-align:center;color:var(--muted)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Sellers.json Monitor</h1>
      <div class="muted" id="updated">Loading…</div>
    </div>
    <div class="muted" id="range"></div>
  </header>

  <div id="watchAlert"></div>

  <div class="kpis">
    <div class="kpi"><div class="l">SSPs monitored</div><div class="v" id="kSsps">–</div></div>
    <div class="kpi"><div class="l">Added · last 7 days</div><div class="v" id="kAdd" style="color:var(--add)">–</div></div>
    <div class="kpi"><div class="l">Removed · last 7 days</div><div class="v" id="kRem" style="color:var(--rem)">–</div></div>
    <div class="kpi"><div class="l">Changed · last 7 days</div><div class="v" id="kChg" style="color:var(--chg)">–</div></div>
  </div>

  <div class="card">
    <h2>SSPs</h2>
    <div class="scroll"><table>
      <thead><tr><th>SSP</th><th>Status</th><th class="num">Sellers</th><th>Playdigo / Yaggdigo ID</th><th class="num">Last run +/−/~</th><th>Last change</th><th>Last checked</th><th>Source</th></tr></thead>
      <tbody id="sspBody"></tbody>
    </table></div>
  </div>

  <div class="card">
    <h2>Change log</h2>
    <div class="filters">
      <input type="search" id="q" placeholder="Search seller name, domain or ID…">
      <select id="fSsp"><option value="">All SSPs</option></select>
      <select id="fType"><option value="">All changes</option><option value="added">Added</option><option value="removed">Removed</option><option value="changed">Changed</option></select>
      <select id="fType2"><option value="">All seller types</option><option>PUBLISHER</option><option>INTERMEDIARY</option><option>BOTH</option></select>
      <select id="fDays"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="0">All history</option></select>
      <label class="muted" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="fWatch"> Watch list only</label>
      <button id="csv">Download CSV</button>
    </div>
    <div class="scroll"><table>
      <thead><tr><th>Date</th><th>SSP</th><th>Change</th><th>Seller ID</th><th>Name</th><th>Domain</th><th>Type</th><th>Details</th></tr></thead>
      <tbody id="chgBody"></tbody>
    </table></div>
    <div class="pager"><span class="muted" id="count"></span><button id="prev">‹ Prev</button><button id="next">Next ›</button></div>
  </div>
</div>

<script>
const PAGE = 100;
let changes = [], status = null, page = 0, filtered = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtN = n => n == null ? "–" : Number(n).toLocaleString("en-US");
const fmtT = t => t ? new Date(t).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}) : "–";
const daysAgo = d => { const x = new Date(); x.setDate(x.getDate() - d); return x.toISOString().slice(0,10); };
const domainLink = d => d ? `<a href="https://${esc(d)}" target="_blank" rel="noopener">${esc(d)}</a>` : "–";

async function load() {
  const bust = "?t=" + Date.now();
  try {
    [status, changes] = await Promise.all([
      fetch("data/status.json" + bust).then(r => r.ok ? r.json() : null),
      fetch("data/changes.json" + bust).then(r => r.ok ? r.json() : []),
    ]);
  } catch (e) { status = null; changes = []; }
  changes = (changes || []).sort((a, b) => b.date.localeCompare(a.date) || a.ssp.localeCompare(b.ssp));
  renderStatus(); renderKpis(); renderWatch();
  const ssps = [...new Set((status?.ssps || []).map(s => s.name).concat(changes.map(c => c.ssp)))];
  $("fSsp").innerHTML = '<option value="">All SSPs</option>' + ssps.map(s => `<option>${esc(s)}</option>`).join("");
  applyFilters();
}

function renderStatus() {
  if (!status) { $("updated").textContent = "No data yet: run the workflow once."; $("sspBody").innerHTML = '<tr><td colspan="8" class="empty">No runs yet</td></tr>'; return; }
  $("updated").textContent = "Last run: " + fmtT(status.generated_at);
  const label = {ok:"OK", baseline:"Baseline saved", error:"Download failed", anomaly:"Ignored bad file"};
  $("sspBody").innerHTML = status.ssps.map(s => `<tr>
    <td><b>${esc(s.name)}</b></td>
    <td class="st-${s.status}" title="${esc(s.error)}">${label[s.status] || s.status}${s.error ? " ⓘ" : ""}</td>
    <td class="num">${fmtN(s.count)}</td>
    <td>${ours(s.ours)}</td>
    <td class="num">${s.status === "ok" ? `<span style="color:var(--add)">+${s.added}</span> / <span style="color:var(--rem)">−${s.removed}</span> / <span style="color:var(--chg)">~${s.changed}</span>` : "–"}</td>
    <td>${fmtT(s.last_change)}</td>
    <td>${fmtT(s.last_checked)}</td>
    <td>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">sellers.json</a>` : "–"}</td></tr>`).join("");
}

function ours(list) {
  if (list == null) return '<span class="muted">–</span>';
  if (!list.length) return '<span class="muted">Not listed</span>';
  return list.map(o => `<span class="ours" title="${esc(o.name)} · ${esc(o.domain)}"><b>${esc(o.id)}</b> <span class="muted">${esc(o.name)} · ${esc((o.type || "").toLowerCase())}</span></span>`).join("<br>");
}

function renderKpis() {
  const since = daysAgo(7), recent = changes.filter(c => c.date >= since);
  $("kSsps").textContent = status ? status.ssps.length : "–";
  $("kAdd").textContent = fmtN(recent.filter(c => c.change === "added").length);
  $("kRem").textContent = fmtN(recent.filter(c => c.change === "removed").length);
  $("kChg").textContent = fmtN(recent.filter(c => c.change === "changed").length);
  if (changes.length) $("range").textContent = `History since ${changes[changes.length - 1].date}`;
}

function renderWatch() {
  const w = changes.filter(c => c.watched && c.date >= daysAgo(30));
  $("watchAlert").innerHTML = w.length ? `<div class="alert"><b>🚨 ${w.length} change(s) on your watch list in the last 30 days</b><br>` +
    w.slice(0, 8).map(c => `${esc(c.date)} · ${esc(c.ssp)} · <b>${esc(c.change)}</b> · ${esc(c.seller_id)} ${esc(c.name)} (${esc(c.domain)})`).join("<br>") + "</div>" : "";
}

function applyFilters() {
  const q = $("q").value.trim().toLowerCase(), ssp = $("fSsp").value, t = $("fType").value,
        st = $("fType2").value, days = +$("fDays").value, watch = $("fWatch").checked;
  const since = days ? daysAgo(days) : "";
  filtered = changes.filter(c =>
    (!since || c.date >= since) && (!ssp || c.ssp === ssp) && (!t || c.change === t) &&
    (!st || c.seller_type === st) && (!watch || c.watched) &&
    (!q || `${c.name} ${c.domain} ${c.seller_id}`.toLowerCase().includes(q)));
  page = 0; renderChanges();
}

function renderChanges() {
  const rows = filtered.slice(page * PAGE, (page + 1) * PAGE);
  $("chgBody").innerHTML = rows.length ? rows.map(c => `<tr>
    <td>${esc(c.date)}</td><td>${esc(c.ssp)}</td>
    <td><span class="pill ${c.change}">${c.change}</span></td>
    <td>${c.watched ? '<span class="star">★ </span>' : ""}${esc(c.seller_id)}</td>
    <td>${esc(c.name) || "–"}${c.confidential ? ' <span class="muted">(confidential)</span>' : ""}</td>
    <td>${domainLink(c.domain)}</td><td>${esc(c.seller_type)}</td>
    <td class="wrapcell muted">${esc(c.details)}</td></tr>`).join("")
    : '<tr><td colspan="8" class="empty">No changes match these filters</td></tr>';
  const pages = Math.max(1, Math.ceil(filtered.length / PAGE));
  $("count").textContent = `${fmtN(filtered.length)} rows · page ${page + 1} of ${pages}`;
  $("prev").disabled = page === 0; $("next").disabled = page >= pages - 1;
}

function downloadCsv() {
  const cols = ["date","ssp","change","seller_id","name","domain","seller_type","confidential","details","watched"];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = [cols.join(",")].concat(filtered.map(r => cols.map(c => q(r[c])).join(","))).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
  a.download = `sellers-changes-${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

["q","fSsp","fType","fType2","fDays","fWatch"].forEach(id => $(id).addEventListener("input", applyFilters));
$("prev").onclick = () => { page--; renderChanges(); };
$("next").onclick = () => { page++; renderChanges(); };
$("csv").onclick = downloadCsv;
load();
</script>
</body>
</html>
