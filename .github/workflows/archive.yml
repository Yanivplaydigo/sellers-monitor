name: archive check (one-off)
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [archive_removed.py]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python archive_removed.py
      - run: |
          git config user.name "sellers-monitor"
          git config user.email "sellers-monitor@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "archive check $(date -u +%F)"
          git pull --rebase && git push
